name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Run by hand from the Actions tab ("Run workflow") or `gh workflow run ci`.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-tests:
    name: CPU tests (${{ matrix.os }})
    # Windows too: the pipeline's machine is a Windows PC, and Linux alone has
    # missed platform-dependent results (the joint solve, 2026-11-24).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash      # Git Bash on Windows, so every step reads the same
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system libs (opencv-python; ffmpeg for tests/test_field.py)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 ffmpeg

      - name: Install ffmpeg (tests/test_field.py)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Install package + test extras
        run: |
          python -m pip install --upgrade pip
          # CPU torch first: left to PyPI, the editable install below would pull
          # the multi-GB CUDA build to satisfy pyproject's torch requirement.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[test]"

      - name: Show env
        run: |
          python -c "import numpy, scipy, cv2, omegaconf, pyarrow, torch; \
            print('numpy', numpy.__version__); \
            print('scipy', scipy.__version__); \
            print('opencv', cv2.__version__); \
            print('omegaconf', omegaconf.__version__); \
            print('pyarrow', pyarrow.__version__); \
            print('torch', torch.__version__)"

      - name: Run CPU test suite
        run: |
          pytest -m "not gpu and not slow and not real_video" \
            --junitxml=pytest.xml -ra -v

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.os }}
          path: pytest.xml

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # PINNED. Unpinned, this job adopts whatever ruff shipped that morning,
      # and a linter release turns into a red build on a commit that never
      # touched the code. Bump it deliberately, together with the diff it causes.
      - name: Install ruff
        run: pip install ruff==0.16.2

      - name: Lint
        run: ruff check nfl_gsplat tests scripts
