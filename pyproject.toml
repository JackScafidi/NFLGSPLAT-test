[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nfl_gsplat"
version = "0.1.0"
description = "NFL broadcast -> free-viewpoint Gaussian Splatting pipeline"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    # <2: paddleocr/paddle + the pinned torch/mmcv stack use np.sctypes etc.,
    # removed in NumPy 2.0. The conda envs pin numpy=1.26.4; keep the editable
    # install from upgrading past it.
    "numpy>=1.24,<2",
    "scipy>=1.10",
    "omegaconf>=2.3",
    "pyyaml>=6.0",        # nfl_gsplat/settings.py reads local.yaml (omegaconf brings it too)
    "typer>=0.12",
    "rich>=13.0",
    "opencv-python>=4.8",
    "pandas>=2.0",
    # <21: pyarrow 21+ is built against NumPy 2, so under numpy<2 above every
    # Parquet read and write fails. 20.0.0 is the version tested.
    "pyarrow>=14.0,<21",
    # torch: the pose, render and timeline code and 11 CPU tests import it.
    # Install it first from the PyTorch index that matches the machine, then
    # this package: CPU, `pip install torch --index-url https://download.pytorch.org/whl/cpu`;
    # NVIDIA, the `cu128` index. Left to plain PyPI, Linux pulls the CUDA build.
    "torch>=2.1",
    "plyfile>=1.0",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "av>=11",             # iter_frames (utils/video.py) decodes via imageio's pyav plugin
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-xdist>=3.5"]

[tool.setuptools.packages.find]
include = ["nfl_gsplat*"]
exclude = ["tests*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires a CUDA-capable GPU",
    "slow: takes more than ~10 seconds",
    "smoke: full end-to-end pipeline on synthetic fixtures",
    "real_video: requires real broadcast video + body models + annotations",
]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# SELECT EXPLICITLY. Without this line ruff applies its DEFAULT rule set, and
# that set grows with every release -- while CI installed ruff unpinned, so the
# lint job broke on its own with no code change behind it. By ruff 0.16 the
# default had pulled in I, B, UP, SIM, RUF, PL, S, C4 and FURB: 309 findings
# against the 32 reported by the rules this project actually chose. Naming the
# set here is what stops a linter release from becoming a repo-wide diff.
select = ["E", "F"]
# E702 (multi-statement-on-one-line semicolon) is intentional for tight numpy
# array initializers and test scaffolding. Keep the rest of E + F.
# E501 (line too long) is ignored (decided 2026-11-24): 2201 lines in 139 files
# ran past 110, mostly code with aligned trailing comments. Reflowing them by
# hand is a large, risky diff; `ruff format` rewrites 455 files and still leaves
# 875. line-length = 110 above stays as the guide for new code.
ignore = ["E702", "E501"]
